name: Build APK

on:
  push:
    branches: [ main, master, claude/* ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'
        cache: true

    - name: Create local.properties
      working-directory: financial_freedom/android
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "flutter.sdk=$FLUTTER_ROOT" >> local.properties
        echo "flutter.versionCode=1" >> local.properties
        echo "flutter.versionName=1.0.0" >> local.properties

    - name: Get dependencies
      working-directory: financial_freedom
      run: flutter pub get

    - name: Generate code (Drift database)
      working-directory: financial_freedom
      run: dart run build_runner build --delete-conflicting-outputs

    - name: Analyze code
      working-directory: financial_freedom
      run: flutter analyze --no-fatal-infos
      continue-on-error: true

    - name: Run tests
      working-directory: financial_freedom
      run: flutter test
      continue-on-error: true

    - name: Build Release APK
      working-directory: financial_freedom
      run: flutter build apk --release

    - name: Build Debug APK
      working-directory: financial_freedom
      run: flutter build apk --debug

    - name: Rename APKs
      run: |
        mkdir -p artifacts
        cp financial_freedom/build/app/outputs/flutter-apk/app-release.apk artifacts/financial-freedom-release.apk
        cp financial_freedom/build/app/outputs/flutter-apk/app-debug.apk artifacts/financial-freedom-debug.apk

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: financial-freedom-release-apk
        path: artifacts/financial-freedom-release.apk
        retention-days: 30

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: financial-freedom-debug-apk
        path: artifacts/financial-freedom-debug.apk
        retention-days: 14

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
    - name: Download Release APK
      uses: actions/download-artifact@v4
      with:
        name: financial-freedom-release-apk

    - name: Get version info
      id: version
      run: |
        echo "date=$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT
        echo "tag=v1.0.0-$(date +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        name: Financial Freedom ${{ steps.version.outputs.date }}
        body: |
          ## Financial Freedom APK

          **Kompas Kebebasan Finansialmu**

          ### Download
          Download file `financial-freedom-release.apk` di bawah ini.

          ### Cara Install di HP Android
          1. Download file APK dari bagian **Assets** di bawah
          2. Buka file di HP Android
          3. Jika diminta, izinkan **"Install dari sumber tidak dikenal"**
          4. Tap **Install** dan tunggu selesai
          5. Buka aplikasi **Financial Freedom**

          ### Fitur
          - Phase 1: Reality Engine - Input data keuangan
          - Phase 2A: Onboarding System - Setup awal
          - Phase 2B: Exit Simulator - Simulasi kebebasan finansial
        files: financial-freedom-release.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
